# Machine-specific lookup tables, fed to the `lookup` / `lookupPath` templates
# in .chezmoitemplates by .chezmoi.toml.tmpl (re-run `chezmoi init` after an
# edit here: the values are baked into ~/.config/chezmoi/chezmoi.toml).
#
# Keys are tried most specific first: os/hostname/username -> os/hostname ->
# os. On WSL2 the Windows-app tables (firefox*, vscode*) are looked up as
# `windows` and joined onto the Windows home, so a WSL-only row is keyed
# `windows/<hostname>/<linux user>`.
#
# ---------------------------------------------------------------- poetry ----

[lookups.pypoetryDir]
  default = ""
[lookups.pypoetryDir.table]
  "darwin/jack06215/nacho" = ".cache/pypoetry/virtualenvs"
  "darwin/A0229/jack.cho" = "Library/Caches/pypoetry/virtualenvs"

# poetry venv directory names are per-machine hashes, so these key on the
# username too. Joined onto the resolved pypoetryDir above. A machine with no
# zshPythonVenv row asks `poetry env info --path` in the monorepo instead, so
# a row is only needed to override that.
[lookups.zshPythonVenv]
  default = ""
[lookups.zshPythonVenv.table]
  "darwin/jack06215/nacho" = "monorepo-e2o0ZM2H-py3.14"
  "darwin/A0229/jack.cho" = "monorepo-kcQbGqAg-py3.14"

[lookups.fwMonorepoPythonVenv]
  default = ""
[lookups.fwMonorepoPythonVenv.table]
  "darwin/A0229/jack.cho" = "monorepo-XYqwb38J-py3.13"

# ------------------------------------------------------------------- git ----

# "true"/"false": whether this machine signs commits (commit.gpgsign in
# dot_config/git/config.tmpl). Signing needs the GPG key imported into
# $GNUPGHOME; give a machine without it a "false" row, or every commit fails
# with "gpg failed to sign the data".
[lookups.gitSign]
  default = "true"
[lookups.gitSign.table]
  android = "false"

# -------------------------------------------------------------- chezmoi ----

# "true"/"false": whether chezmoi on this machine leaves the work to the WSL2
# side. On a Windows box whose dotfiles are applied from inside WSL,
# run_onchange_after_push-windows-configs already copies every Windows-app
# config into C:\Users\<user>. A second, native-Windows apply overwrites those
# copies with its own rendering - and from outside WSL it cannot know the
# distro, so machine.lua's wsl_* fields come out empty and WezTerm drops to
# PowerShell instead of opening WSL. So the Windows side is switched off:
# .chezmoiignore ignores everything there, and run_before_defer-to-wsl stops
# `chezmoi apply` with an explanation. Only ever "true" under a `windows` key -
# WSL2 itself is `linux`, and shares the hostname.
[lookups.deferToWSL]
  default = "false"
[lookups.deferToWSL.table]
  "windows/MSI" = "true"

# --------------------------------------------------------------- firefox ----

[lookups.firefoxProfilesDir]
  default = ""
[lookups.firefoxProfilesDir.table]
  darwin = "Library/Application Support/Firefox/Profiles"
  linux = ".mozilla/firefox"
  windows = "AppData/Roaming/Mozilla/Firefox/Profiles"

# The "<random>.<name>" profile directory inside the folder above. Not a path,
# so it is looked up directly rather than through lookupPath.
#
# The `windows` rows feed only the native-Windows link script. On WSL2,
# push-windows-configs reads the profile from profiles.ini instead
# (.chezmoitemplates/firefoxProfileDir), so a new machine needs no row there.
[lookups.firefoxProfileId]
  default = "vfop1w54.default"
[lookups.firefoxProfileId.table]
  windows = "au24w27m.MinimalistDark"

# ---------------------------------------------------------------- vscode ----

[lookups.vscodeUserDir]
  default = ""
[lookups.vscodeUserDir.table]
  darwin = "Library/Application Support/Code/User"
  linux = ".config/Code/User"
  windows = "AppData/Roaming/Code/User"
