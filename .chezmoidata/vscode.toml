# macOS only. These run on the UI side ("extensionKind": ["ui"]), so they can't
# go into WSL's VS Code Server, where the script installs on WSL2; there they
# belong to Windows' own VS Code, which this doesn't manage. AppleScript is a
# Mac thing anyway.
vscodeExtensionsDarwin = [
  "ms-vscode-remote.remote-containers",
  "ms-vscode-remote.remote-ssh",
  "ms-vscode-remote.remote-ssh-edit",
  "ms-vscode-remote.remote-wsl",
  "ms-vscode.remote-explorer",
  "openai.codex-audio",
  "tkoresearch.applescript-support",
]
