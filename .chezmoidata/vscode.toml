# The VS Code extensions this machine set has, installed where missing by
# run_onchange_after_install-vscode-extensions.sh.tmpl on macOS and WSL2. The
# first groups are the ones dot_config/vscode/{settings,keybindings}.json and
# nvim's lua/config/keymaps/vscode.lua call into; the rest is everything else
# that was installed on the Mac when the list was taken (2026-10-04). Dropping
# an entry here does not uninstall anything. Plain data, read on every apply:
# no `chezmoi init` needed after an edit here.
#
# `bazel run //tools/setup:export_vscode_extensions` appends what is installed
# but not listed, under a marker at the end of its array; sort it into a group.
#
# Not here: jack06215.nvim-in-vscode (nvicode), which the monorepo installs from its
# own vsix (`bazel run //packages/nvim_in_vscode:install`), not from the
# marketplace.
#
# Not `[vscode]`: that key is already the config data from .chezmoi.toml.tmpl
# (.vscode.userDir).
vscodeExtensions = [
  # the Vim engine: real nvim with ~/.config/nvim
  "asvetliakov.vscode-neovim",

  # git: <leader>g* (blame, history, browse, compare), <leader>gl, octo's <leader>o*
  "eamodio.gitlens",
  "mhutchie.git-graph",
  "github.vscode-pull-request-github",

  # ]t/[t, <leader>xt/st; nvim's diagnostic virtual text, <leader>ud;
  # harpoon keys; <leader>us and the shared nvim spell file
  "gruntfuggly.todo-tree",
  "usernamehw.errorlens",
  "tobias-z.vscode-harpoon",
  "streetsidesoftware.code-spell-checker",

  # conform / nvim-lint parity
  "ms-python.python",
