set -g prefix C-s           # Change prefix key to C-s
unbind C-b
set -sg escape-time 1       # keystroke delay
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"  # reload config file in current session
bind C-s send-prefix        # send C-s to nested sessions
set -g history-limit 50000

##### KEYBINDS

# NOTE: no `bind -n C-j/C-k` arrow aliases here. Being prefix-less they were
# swallowed before the pane's program ever saw them, which broke C-j/C-k window
# navigation in nvim (LazyVim default), ^J accept-line in zsh, and Ctrl-J
# newline in Claude Code. C-k -> Up also tripped atuin's up-search widget.

### PANE
# Movement between panes. This layer is tmux-only on purpose: nvim splits are
# reached with C-hjkl (LazyVim default), so there is nothing to forward into
# nvim. The previous version guarded these with an `is_vim` probe and sent M-hjkl
# through to nvim, but nothing in the nvim config binds M-hjkl - so M-h/M-l did
# nothing and M-j/M-k hit LazyVim's <A-j>/<A-k> and *moved the current line*.
# Dropping the probe also removes a `ps | grep` fork on every single keypress.
bind -n 'M-h' select-pane -L
bind -n 'M-j' select-pane -D
bind -n 'M-k' select-pane -U
bind -n 'M-l' select-pane -R
bind -T copy-mode-vi 'M-h' select-pane -L
bind -T copy-mode-vi 'M-j' select-pane -D
bind -T copy-mode-vi 'M-k' select-pane -U
bind -T copy-mode-vi 'M-l' select-pane -R
# Change size of pane
bind -r < resize-pane -L 5
bind -r > resize-pane -R 5
bind -r = resize-pane -D 5
bind -r + resize-pane -U 5
# Create new pane; copy cwd
bind -n M-v split-window -vc "#{pane_current_path}"
bind -n M-b split-window -hc "#{pane_current_path}"
bind -n M-y split-window -hc "#{pane_current_path}" \; resize-pane -x 100
bind -n M-t split-window -vc "#{pane_current_path}" \; resize-pane -y 16
bind | split-window -h
bind - split-window -v
# Kill pane (confirm: this is prefix-less, one stray M-x would take an unsaved
# editor with it)
bind -n M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane
# Zoom pane
bind -n M-z resize-pane -Z

### SCRATCH BUFFER
bind -n M-w display-popup -w "80%" -h "80%" -E "tmux new-session -A -s scratch"
bind -n M-r display-popup -w "90%" -h "95%" -E "tmux new-session -A -s monitor"

### WINDOWS
# Create new window; copy cwd
bind -n M-c new-window -c '#{pane_current_path}'
# Movement between windows
bind -n M-, select-window -t :-
bind -n M-\; select-window -t :+
bind -n M-0 select-window -t 10   # base-index is 1, so window 0 never exists
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# Delete Windows
bind X kill-window

### SESSIONS
# Detach session
bind -n M-d detach-client
# Switch session
bind -n M-s run-shell 'tmux choose-tree -swZ -O time -f "##{&&:##{!=:##{session_name},#{session_name}},##{&&:##{!=:##{session_name},monitor},##{!=:##{session_name},scratch}}}"'
bind -n M-i switch-client -l

### COPY MODE
bind -n M-m copy-mode -e # enter copy mode keybind
# Paste from the system clipboard. Resolved at runtime rather than hardcoding
# `xclip -o`, which does not exist on macOS.
bind -n M-p run-shell 'if command -v pbpaste >/dev/null 2>&1; then pbpaste; elif command -v wl-paste >/dev/null 2>&1; then wl-paste --no-newline; else xclip -selection clipboard -out; fi | tmux load-buffer - && tmux paste-buffer'

##### OTHER CONFIGURATIONS
# Enable mouse and mouse scroll
setw -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# terminal color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ',*:Tc' # this is for 256 color
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q' # this is for the cursor shape

# Extended ("disambiguated") keys.
#
# A terminal hands a program bytes, not key events, and the classic encoding has
# no room to say "Enter, but with Shift held" - Enter, Ctrl-M and Shift-Enter all
# arrive as a bare \r. Modern terminals can encode the difference, but tmux sits
# in the middle as both a terminal (to the pane's program) and a program (to
# WezTerm), so both halves have to opt in:
#
#   extkeys in terminal-features  tells tmux the *outer* terminal can encode
#                                 these. tmux only knows what terminfo tells it,
#                                 and the xterm-256color entry WezTerm reports
#                                 does not advertise the capability, so without
#                                 this tmux never turns the mode on upstream and
#                                 WezTerm keeps sending a plain \r.
#   extended-keys on              lets tmux pass the disambiguated key back *down*
#                                 to the pane's program - but only to programs
#                                 that asked for it, so anything older keeps
#                                 seeing a plain \r instead of stray escapes.
#                                 Use `always` if a program that wants these
#                                 never asks; the cost is that programs which
#                                 cannot parse them (zsh) echo the raw sequence.
#
# csi-u is the modern encoding (Shift-Enter -> \e[13;2u), understood by Claude
# Code and nvim. The default `xterm` format sends xterm's older modifyOtherKeys
# form (\e[27;2;13~) which fewer programs parse.
#
# Concretely: this is what makes Shift-Enter insert a newline in Claude Code
# rather than submit the prompt. (Ctrl-J still works as the portable fallback -
# see the KEYBINDS note above about not stealing it.)
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -s extended-keys-format csi-u

# neovim config
set -g focus-events on

# Start window/pane numbers from 1. pane-base-index is a *window* option, so
# only the `setw` form is meaningful here.
set -g base-index 1
setw -g pane-base-index 1

# Status Bar
#
# The *contents* of the bar are no longer configured here. tmux-powerline (last
# in the plugin list at the bottom of this file) sets status-left, status-right,
# status-style, message-style, status-interval, status-justify,
# window-status-format, window-status-current-format and window-status-separator
# from its own main.tmux, which tpm runs after this file has been read. Setting
# any of them here is silently overwritten - which is why the old hand-rolled
# status-left/right, the cyan-on-default/white-on-red window styles and the
# 15-second interval are gone rather than merely commented out. Their
# replacements live in
#
#   ~/.config/tmux-powerline/config.sh        intervals, lengths, segment options
#   ~/.config/tmux-powerline/themes/mocha.sh  colours, and which segments appear
#
# both of which chezmoi manages alongside this file. `prefix + r` reloads them
# the same way it reloads this one.
#
# status-position is one of the few status options the plugin leaves alone, so
# the bar still sits at the top.
set -g status-position top

# Color of pane border (line between panes)
set -g pane-border-style fg=white
set -g pane-active-border-style fg=yellow

# Visuals on, image support
setw -g monitor-activity on
set -g visual-activity off
set -gq allow-passthrough on
# TERM deliberately omitted: tmux overrides it per-pane from default-terminal
# after applying the session environment, so listing it here does nothing.
set -ga update-environment TERM_PROGRAM

# Use vim keybindings in copy mode
setw -g mode-keys vi
bind-key    -T copy-mode-vi v     send-keys -X begin-selection
bind-key    -T copy-mode-vi V     send-keys -X select-line
bind-key    -T copy-mode-vi C-v   send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Copy to the system clipboard. These used to pipe to `clip-in`, which is not
# installed and is not defined anywhere in this repo, so every copy silently
# went nowhere. `copy-command` is resolved by sh at copy time, so one config
# covers macOS, Wayland and X11; `set-clipboard on` additionally emits OSC 52
# so copying works through WezTerm and over SSH.
set -g set-clipboard on
set -s copy-command 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -in; fi'
bind-key    -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
bind-key    -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key    -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

##### Plugins
# $HOME rather than ${XDG_DATA_HOME}: this file is parsed by the tmux *server*,
# which only inherits XDG_DATA_HOME when the server happens to be started from a
# shell that sourced ~/.zshenv. Start it from a LaunchAgent or cron and the path
# silently collapses to "/tmux/plugins/tpm/tpm" with no error. $HOME is always
# present. (zshenv pins XDG_DATA_HOME to $HOME/.local/share on every platform,
# so this is the same location, just resolved unconditionally.)
# TPM appends the trailing "/" itself, so it is omitted here.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @suspend_key 'M-q'
# What the bar looks like while M-q has the outer tmux suspended.
#
# This list used to grey out status-left-style and the three window-status-*
# styles. Those no longer do anything: tmux-powerline renders both the left side
# and the window list through formats that carry their own inline `#[fg=…,bg=…]`,
# and an inline colour beats the corresponding *-style option. status-style is
# still honoured, though - it is what paints the parts of the bar no segment
# covers - so dimming it is enough to grey the whole strip. The two
# @mode_indicator_* entries went with them; those address tmux-mode-indicator,
# a plugin this config has never had installed.
#
# The other half of the signal is the mode_indicator segment, which reads the
# `suspended` key-table directly and spells out SUSPEND on the left. That one
# updates on the next status refresh rather than instantly, which is why the
# status-style change (immediate, tmux-suspend calls refresh-client -S) is worth
# keeping alongside it.
set -g @suspend_suspended_options " \
  status-style::bg=#313244\\,fg=#6c7086, \
"

set -g @plugin 'laktak/extrakto' # <tab>: fzf from current pane
set -g @plugin 'pysan3/tmux-copy-toolkit' # S: easycopy, Q: quickcopy, P: quickopen, W: linecopy
set -g @plugin 'MunifTanjim/tmux-suspend' # suspend nested tmux sessions
set -g @plugin 'Morantron/tmux-fingers' # Easy copy for perticular strings `prefix + F`
set -g @plugin 'craftzdog/tmux-claude-session-manager'
set -g @plugin 'schasse/tmux-jump'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix + Space: menu of everything below
# Last on purpose. tpm sources plugins in the order they are declared, and this
# one's main.tmux overwrites status-left, status-right, status-style,
# message-style and the window-status formats. Declared earlier, any plugin
# below it that touches the status bar would win instead.
set -g @plugin 'erikw/tmux-powerline' # the status bar; configured in ~/.config/tmux-powerline

# tmux-which-key builds its menu from a YAML file, but only ever reads that file
# from inside its own plugin directory - which TPM owns and chezmoi does not
# manage, so an edit there would be lost on the next `tpm clean`. Symlink the
# repo copy over it before tpm runs; the plugin's "copy the example config if
# none exists" step then sees a file and leaves the link alone.
#
# The plugin's own @tmux-which-key-xdg-enable option is meant to solve exactly
# this, but the path handling behind it calls `realpath --relative-to`, a GNU
# flag that macOS' BSD /bin/realpath does not have. With `set -e` at the top of
# plugin.sh.tmux the failure aborts the script, so the plugin never loads at all.
run-shell 'wk="$HOME/.local/share/tmux/plugins/tmux-which-key"; if [ -d "$wk" ]; then ln -sfn "$HOME/.config/tmux/which-key.yaml" "$wk/config.yaml"; fi'

run "$HOME/.local/share/tmux/plugins/tpm/tpm"

##### Post-plugin overrides
# `run-shell` without -b blocks the command queue until it exits, so everything
# below really does run after tpm has sourced every plugin. This is the only
# place a status option the plugins claim can be set and made to stick.

# tmux-powerline points message-style at its own status style, which is
# transparent - so "Reloaded!" and the confirm-before prompts would appear as
# bare text floating on the bar. Catppuccin Mocha crust-on-yellow instead, which
# reads as a distinct notification rather than as another segment.
set -g message-style bg=#f9e2af,fg=#1e1e2e
set -g message-command-style bg=#f9e2af,fg=#1e1e2e

# `prefix + ?` is `list-keys -N`, which prints only the bindings that carry a
# note - so tmux's own defaults show up there and everything bound in this file
# does not. tmux-which-key binds `prefix + Space` without a note, which left the
# menu itself invisible in that list; re-binding it here attaches one.
#
# `show-wk-menu-root` is a command alias the plugin registers holding the entire
# root menu, so this is the same menu rather than a copy that would drift from
# which-key.yaml. It only exists once the plugin has loaded, which is why this
# sits after tpm.
#
# Nothing else here is annotated on purpose: list-keys -N prints every key with
# the prefix in front regardless of table, so a note on a `bind -n` key would be
# listed as "C-s M-h" - false, since those are prefix-less. The M- layer stays
# documented in the which-key menu, where the names already spell the keys out.
bind -N "Which-key menu" Space show-wk-menu-root
