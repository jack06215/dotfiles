[[snippets]]
    command = """
open <file=data.csv>
| where status == "<status=active>"
| where score >= <min_score=80>
| select name email score
| sort-by score --reverse
| to yaml"""
    description = "filter CSV rows and write them out as YAML"
    tag = ["nu", "csv", "yaml", "filter"]
[[snippets]]
    command = """
let sql = (vipe --suffix sql)
open <db=~/.local/share/atuin/history.db> | query db $sql"""
    description = "run SQL query against atuin DB."
    tag = ["nu", "sqlite", "vipe", "atuin", "query"]
